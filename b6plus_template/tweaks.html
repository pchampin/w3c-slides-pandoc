<script>
// This script makes some tweaks to the HTML generated by Pandoc,
// that otheriwse causes some glitches in B6plus.

window.addEventListener('load', () => {

  console.log("remove class 'incremental' in parent DIV of unique child UL.incremental'");
  for (div of document.querySelectorAll("div.incremental:has(> ul.incremental:first-child:last-child)")) {
    console.log(div);
    div.classList.remove('incremental');
  }

  console.log("move up all classes of LI's unique child DIV.next");
  for (child of document.querySelectorAll("li > div.next:first-child:last-child")) {
    console.log(child);
    child.parentElement.className =  child.className;
    child.className = "";
  }
});
</script>
